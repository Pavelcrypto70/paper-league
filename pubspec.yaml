name: paper_league
description: Paper trading desk ranked by discipline — not luck.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.5
  http: ^1.4.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  audioplayers: ^6.8.1
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  cross_file: ^0.3.4
  supabase_flutter: ^2.16.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#03050A"
  adaptive_icon_foreground: assets/branding/app_icon_fg.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#03050A"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#03050A"
    image: assets/branding/splash_logo.png
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/branding/
